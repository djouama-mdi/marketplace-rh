<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace RH - Accès</title>
  <link rel="stylesheet" href="stylelogin.css">
</head>

<body class="auth-body">

  <div class="auth-container">

    <!-- LEFT VISUAL -->
    <div class="auth-left">
      <h1>Marketplace RH</h1>
      <p>
        Plateforme B2B moderne inspirée des standards RH digitaux.
      </p>
    </div>

    <!-- RIGHT LOGIN -->
    <div class="auth-right">

      <div class="auth-card">

        <div class="logo">RH</div>

        <h2>Accès sécurisé</h2>
        <p class="subtitle">Veuillez entrer votre mot de passe</p>

        <input type="password" id="password" placeholder="Mot de passe">

        <button onclick="checkPassword()">Se connecter</button>

        <p id="error"></p>

      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

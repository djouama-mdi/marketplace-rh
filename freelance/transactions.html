<!DOCTYPE html>
<html lang="fr">
<head>
<script>(function(){var t=localStorage.getItem("emploitic-fl-theme")||"light";if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}());</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transactions — emploitic Freelance</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="layout-root"></div>
<script src="app.js"></script>
<script>
renderLayout('transactions.html');
function render() {
  const total = state.transactions.filter(t=>t.status==='Réglé').length;
  document.getElementById('page-content').innerHTML = `
    <main class="page">
      <div class="page-header"><div><h1 class="page-title">Historique des transactions</h1><div class="page-sub">Tous les paiements liés à vos abonnements.</div></div><button class="btn btn-outline" onclick="toast('Export PDF généré')">⬇️ Exporter</button></div>

      <div class="card-row grid-3">
        <div class="card kpi"><div class="kpi-label">Paiements réglés</div><div class="kpi-value">${total}</div></div>
        <div class="card kpi"><div class="kpi-label">Plan actif</div><div class="kpi-value" style="font-size:22px">${planLabel(state.user.plan)}</div></div>
        <div class="card kpi"><div class="kpi-label">Prochain prélèvement</div><div class="kpi-value" style="font-size:18px">01 juin 2026</div><div class="kpi-trend">${state.user.plan==='gold'?'5 900 DA':state.user.plan==='medium'?'2 900 DA':'—'}</div></div>
      </div>

      <div class="card mt-24">
        <div class="section-title">Détail des transactions</div>
        <table class="table">
          <thead><tr><th>Date</th><th>Description</th><th>Méthode</th><th>Montant</th><th>Statut</th><th></th></tr></thead>
          <tbody>
            ${state.transactions.map(t=>`
              <tr>
                <td>${t.date}</td>
                <td>${t.label}</td>
                <td class="text-muted">${t.method}</td>
                <td><strong>${t.amount}</strong></td>
                <td><span class="badge ${t.status==='Réglé'?'badge-success':t.status==='Crédit'?'badge-primary':'badge-muted'}">${t.status}</span></td>
                <td><button class="btn btn-ghost btn-sm" onclick="toast('Reçu téléchargé')">Reçu</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </main>
  `;
}
render();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messagerie — Emploitic</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a class="nav-brand" href="app.html"><span class="logo-mark">e</span> emplo<b>itic</b></a>
      <nav class="nav-links">
        <a class="nav-link" href="app.html">Accueil</a>
        <a class="nav-link" href="recherche.html">Offres</a>
        <a class="nav-link" href="recherche.html">Sur Nous</a>
        <a class="nav-link active" href="messagerie.html">Contactez Nous</a>
      </nav>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-ghost">Connexion</a>
        <a href="register.html" class="btn btn-primary">S'inscrire</a>
        <button class="nav-burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <div class="chat-shell" data-chat>
    <aside class="chat-sidebar">
      <header>
        <h2>Messagerie</h2>
        <div class="chat-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Rechercher une conversation...">
        </div>
      </header>
      <div class="conv-list" data-conv-list></div>
    </aside>

    <main class="chat-main">
      <div class="chat-header" data-chat-header></div>
      <div class="chat-body" data-chat-body></div>
      <form class="chat-input" data-chat-form>
        <button type="button" class="send" style="background:var(--bg-soft);color:var(--text-soft)" title="Pièce jointe"><i class="fa-solid fa-paperclip"></i></button>
        <input type="text" placeholder="Écrire un message..." data-chat-input autocomplete="off">
        <button type="submit" class="send" title="Envoyer"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>

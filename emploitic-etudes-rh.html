<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Études RH — Emploitic</title>

<body>
<div id="site-nav"></div>
<section class="page-hero"><div class="container page-hero-grid">
  <div class="fade-in"><span class="eyebrow">📈 Études RH</span>
    <h1>La data RH d'Algérie, en clair.</h1>
    <p class="sub">Études, baromètres et benchmarks sectoriels pour piloter vos décisions RH avec lucidité.</p>
  </div>
  <div class="hero-img fade-in delay-2"><img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=80" alt=""/></div>
</div></section>
<section class="section"><div class="container"><div class="grid grid-3" id="ets"></div></div></section>
<div id="site-footer"></div>
<script src="marketing.js"></script>
<script>
const E = [
  ['Baromètre Recrutement 2026','Tendances, métiers en tension, délais moyens d\'embauche par secteur.','52 pages'],
  ['Marque employeur en Algérie','Perception, attentes des candidats, canaux d\'attraction préférés.','34 pages'],
  ['Étude Tech 2026','Compétences les plus recherchées, profils rares, marché Tech & Data.','41 pages'],
  ['Énergie & Industrie','Recrutement dans les secteurs stratégiques : enjeux et bonnes pratiques.','38 pages'],
  ['Diversité & inclusion','Maturité D&I des entreprises algériennes, leviers d\'action.','29 pages'],
  ['Talent Insights Q4','Snapshot trimestriel : qui recrute, qui bouge, quelles dynamiques.','24 pages'],
];
document.getElementById('ets').innerHTML = E.map(([t,d,p],i)=>`
  <article class="svc-card reveal delay-${(i%4)+1}">
    <div class="ic">📊</div>
    <h3>${t}</h3>
    <p>${d}</p>
    <div class="foot"><span class="price">${p}</span><a href="emploitic-register.html" class="btn btn-outline">Lire l'étude</a></div>
  </article>`).join('');
</script>
</body>
